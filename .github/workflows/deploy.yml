name: Deploy to EC2

# רץ בכל דחיפה ל-main, וגם ניתן להריץ ידנית מלשונית Actions
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # המפתח נשמר כ-base64 בשורה אחת (EC2_SSH_KEY_B64) כדי להימנע מבעיות
      # שורות בהעתקה. כאן מפענחים אותו חזרה לקובץ מפתח תקין.
      - name: Decode SSH key
        run: |
          echo "${{ secrets.EC2_SSH_KEY_B64 }}" | base64 -d > deploy_key
          chmod 600 deploy_key

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key_path: deploy_key
          command_timeout: 30m
          script: bash ~/deploy.sh
