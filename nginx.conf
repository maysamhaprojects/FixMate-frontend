# FixMate frontend — nginx configuration.
# Serves the built web app and forwards API calls to the backend container.
server {
    listen 80;
    server_name _;

    # Forward API requests to the backend service (docker-compose service name "backend")
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Serve the single-page app (fall back to index.html for client-side routes)
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
